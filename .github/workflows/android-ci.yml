name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13846066"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Create temporary release keystore
        run: |
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/ci-release.p12" \
            -storepass temporary-release-pass \
            -keypass temporary-release-pass \
            -alias jasmine \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JasmineAgent CI,O=JasmineAgent,C=US"
          {
            echo "storeFile=$RUNNER_TEMP/ci-release.p12"
            echo "storePassword=temporary-release-pass"
            echo "keyAlias=jasmine"
            echo "keyPassword=temporary-release-pass"
          } > keystore.properties

      - name: Verify
        run: |
          ./gradlew \
            :core-data:testDebugUnitTest \
            :core-domain:testDebugUnitTest \
            :feature-agent:testDebugUnitTest \
            :app:lintDebug \
            :feature-agent:compileDebugAndroidTestKotlin \
            :checkApiDocs \
            :app:assembleRelease \
            --warning-mode all
